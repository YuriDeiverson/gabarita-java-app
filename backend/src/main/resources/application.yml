server:
  port: ${PORT:3001}
  forward-headers-strategy: framework
spring:
  config:
    import: optional:file:.env[.properties]
  application.name: gabarita-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gabarita}
    username: ${DATABASE_USER:gabarita}
    password: ${DATABASE_PASSWORD:gabarita}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 10000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  auth:
    supabase-url: ${SUPABASE_URL:}
    jwks-url: ${SUPABASE_JWKS_URL:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
